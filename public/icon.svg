<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#17234e"/>
      <stop offset="55%" stop-color="#0a0d22"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="140" y1="150" x2="470" y2="350">
      <stop offset="0%" stop-color="#2ff3ff"/>
      <stop offset="100%" stop-color="#8ec2ff"/>
    </linearGradient>
    <linearGradient id="net" gradientUnits="userSpaceOnUse" x1="230" y1="150" x2="70" y2="360">
      <stop offset="0%" stop-color="#ff3ea5"/>
      <stop offset="100%" stop-color="#c04cff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g stroke="#2ff3ff" stroke-opacity=".07" stroke-width="1">
    <path d="M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512"/>
    <path d="M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512"/>
  </g>

  <g transform="translate(256,256) rotate(-9) scale(0.97) translate(-256,-256)">
  <g filter="url(#glow)">
    <!-- neural links -->
    <g stroke="url(#net)" stroke-opacity=".9" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M225 180 L100 160"/>
      <path d="M159 218 L100 160"/>
      <path d="M159 218 L78 256"/>
      <path d="M159 294 L78 256"/>
      <path d="M159 294 L100 352"/>
      <path d="M225 332 L100 352"/>
      <path d="M100 160 L78 256 L100 352"/>
    </g>

    <!-- benzofuranone (aurone) skeleton -->
    <g stroke="url(#ring)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <path d="M225 180 L290.8 218 L290.8 294 L225 332 L159.2 294 L159.2 218 Z"/>
      <path d="M290.8 218 L363.1 194.6 L407.7 256 L363.1 317.4 L290.8 294"/>
    </g>
    <!-- aromatic inner lines -->
    <g stroke="url(#ring)" stroke-opacity=".55" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M176 232 L176 280"/>
      <path d="M212 192 L253 216"/>
      <path d="M253 296 L212 320"/>
    </g>
    <!-- carbonyl C=O -->
    <g stroke="url(#ring)" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M410 243 L458 243"/>
      <path d="M410 269 L458 269"/>
    </g>
  </g>

  <g filter="url(#soft)">
    <g fill="#2ff3ff">
      <circle cx="290.8" cy="218" r="14"/>
      <circle cx="290.8" cy="294" r="14"/>
      <circle cx="363.1" cy="194.6" r="14"/>
      <circle cx="407.7" cy="256" r="14"/>
      <circle cx="363.1" cy="317.4" r="14"/>
    </g>
    <g fill="#9dff3c">
      <circle cx="225" cy="180" r="17"/>
      <circle cx="159.2" cy="218" r="17"/>
      <circle cx="159.2" cy="294" r="17"/>
      <circle cx="225" cy="332" r="17"/>
    </g>
    <g fill="#ff3ea5">
      <circle cx="100" cy="160" r="16"/>
      <circle cx="78" cy="256" r="16"/>
      <circle cx="100" cy="352" r="16"/>
    </g>
    <circle cx="468" cy="256" r="17" fill="#eaf6ff"/>
  </g>
  </g>
</svg>
